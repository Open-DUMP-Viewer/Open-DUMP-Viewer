name: Build and Release (Beta)

# ───────────────────────────────────────────
# トリガー:
#   - beta ブランチへの push 時に実行
#   - workflow_dispatch で手動実行 (beta ブランチを指定して使う)
# 開発フロー: main (開発) → beta (ベータ公開) → release (正式公開)
#
# workflow_dispatch を置く理由: 本ワークフローは build ジョブが Environment
# `release-signing` の承認ゲートを通るため、**承認前にキャンセルすると再開できない**。
# push しか受け付けないと、beta が既に目的の commit を指している状態では「同じ
# commit を push し直す」ことができず、再実行の手段が UI の Re-run only になる。
# (build-and-release.yml には以前から workflow_dispatch があり、beta 側だけが
#  欠けていた。2026-07-26 に実際にこれで詰まったため追加した。)
# ───────────────────────────────────────────
on:
  push:
    branches:
      - beta
  workflow_dispatch:

# GITHUB_TOKEN の既定を read-only に絞る。詳細は build-and-release.yml の同じ
# ブロックのコメントを参照。
permissions:
  contents: read

# 同一ブランチのリリース実行が重ならないようにする。cancel-in-progress は **false**
# (実行の途中で Pre-release 作成や Store 提出まで進むため、割り込みキャンセルはしない)。
# 詳細は build-and-release.yml の同じブロックのコメントを参照。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════
  # ビルドジョブ (x64 / ARM64 並列)
  # ═══════════════════════════════════════════
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest

    # コード署名の承認ゲート: 詳細は build-and-release.yml の同じブロックのコメントを参照。
    environment: release-signing
    permissions:
      contents: read
      id-token: write  # WIF の OIDC トークン発行に必要

    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
            msvc_arch: x64
          - arch: arm64
            rid: win-arm64
            msvc_arch: amd64_arm64

    steps:
      # ─────────────────────────────────────
      # 1. ソースコードをチェックアウト
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─────────────────────────────────────
      # 2. .NET SDK のセットアップ (.NET 10)
      # ─────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ─────────────────────────────────────
      # 3. C ネイティブ DLL ビルド
      #    vcvarsall.bat で MSVC 環境を設定後、cl.exe でビルド
      # ─────────────────────────────────────
      - name: Build native DLL (Open_DumpParser.dll)
        shell: cmd
        working-directory: Logics/DumpParser
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }}
          set DEFS=/DWINDOWS /DWIN32 /DUTF8 /DODV_DLL_MODE /D_CRT_SECURE_NO_WARNINGS /DNDEBUG
          set CFLAGS=/O2 /W3 /LD /MT /nologo /utf-8 /std:c11
          set SRCS=odv_api.c odv_detect.c odv_expdp.c odv_exp.c odv_record.c odv_number.c odv_datetime.c odv_charset.c odv_xml.c odv_csv.c odv_sql.c
          cl %CFLAGS% %DEFS% /I "." /Fe"Open_DumpParser.dll" %SRCS% /link /DLL
          if %ERRORLEVEL% NEQ 0 exit /b 1
          del /q *.obj *.exp *.lib 2>nul
          echo DLL built successfully (${{ matrix.arch }})
          dir Open_DumpParser.dll

      # ─────────────────────────────────────
      # 5. バージョン番号を .vbproj から取得
      # ─────────────────────────────────────
      - name: Get version from .vbproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "Open DUMP Viewer.vbproj"
          $version = $xml.Project.PropertyGroup `
            | Where-Object { $_.Version } `
            | Select-Object -ExpandProperty Version -First 1
          if (-not $version) { $version = "1.0.0" }
          Write-Host "Version: $version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version-beta" >> $env:GITHUB_OUTPUT
          echo "FILE_VERSION=v$version-beta" >> $env:GITHUB_OUTPUT

      # ─────────────────────────────────────
      # 6. NuGet パッケージの復元
      # ─────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore "Open DUMP Viewer.vbproj"

      # ─────────────────────────────────────
      # 7. アプリビルド (Self-contained)
      # ─────────────────────────────────────
      - name: Build application (self-contained)
        run: |
          dotnet publish "Open DUMP Viewer.vbproj" `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            --output ./publish/app

      # ─────────────────────────────────────
      # 7b. コード署名 (自前バイナリ)
      #     詳細は build-and-release.yml の同名ステップのコメントを参照。
      # ─────────────────────────────────────
      - name: Authenticate to Google Cloud (WIF)
        if: vars.ODV_SIGNING == 'enabled'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNER_SA }}
          token_format: access_token

      - name: Setup Java (jsign 実行用)
        if: vars.ODV_SIGNING == 'enabled'
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify jsign 7.5
        if: vars.ODV_SIGNING == 'enabled'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar' -OutFile jsign.jar
          $hash = (Get-FileHash jsign.jar -Algorithm SHA256).Hash.ToLower()
          $expected = '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c'
          if ($hash -ne $expected) { throw "jsign SHA256 不一致: got=$hash expected=$expected" }
          Write-Host 'jsign 7.5 SHA256 OK'

      - name: Sign own binaries (${{ matrix.arch }})
        if: vars.ODV_SIGNING == 'enabled'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $files = @(
            "./publish/app/Open DUMP Viewer.exe",
            "./publish/app/Open DUMP Viewer.dll",
            "./publish/app/Open_DumpParser.dll"
          )
          ./installer/sign/Invoke-OdvSign.ps1 -JsignJar jsign.jar `
            -KeyRingResource '${{ vars.GCP_KEYRING }}' -KeyAlias '${{ vars.GCP_KEY_ALIAS }}' `
            -CertFile installer/sign/codesign-chain.pem `
            -AccessToken '${{ steps.auth.outputs.access_token }}' `
            -ExpectedSubject '${{ vars.SIGNER_SUBJECT }}' -Files $files

      - name: Copy build output for portable and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./publish/portable" -Force | Out-Null
          New-Item -ItemType Directory -Path "./publish/installer-src" -Force | Out-Null
          Copy-Item -Path "./publish/app/*" -Destination "./publish/portable" -Recurse -Force
          Copy-Item -Path "./publish/app/*" -Destination "./publish/installer-src" -Recurse -Force

      # ─────────────────────────────────────
      # 8. DLL が出力に含まれていることを検証
      # ─────────────────────────────────────
      - name: Verify native DLL in output
        shell: pwsh
        run: |
          if (-not (Test-Path "./publish/app/Open_DumpParser.dll")) {
            Write-Error "Open_DumpParser.dll がビルド出力に含まれていません"
            exit 1
          }
          Write-Host "Open_DumpParser.dll found in build output (${{ matrix.arch }})"

      # ─────────────────────────────────────
      # 9. ポータブル版を ZIP に圧縮
      # ─────────────────────────────────────
      - name: Zip portable
        shell: pwsh
        run: |
          $fileVer = "${{ steps.get_version.outputs.FILE_VERSION }}"
          Compress-Archive `
            -Path "./publish/portable/*" `
            -DestinationPath "./publish/OpenDumpViewer_${fileVer}_portable_${{ matrix.arch }}.zip"

      # ─────────────────────────────────────
      # 10. Inno Setup のインストール
      # ─────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # ─────────────────────────────────────
      # 11. 中国語簡体字の言語ファイルをダウンロード
      #     詳細は build-and-release.yml の同名ステップのコメントを参照。
      # ─────────────────────────────────────
      - name: Download Chinese Simplified language file
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" `
            -OutFile "installer/ChineseSimplified.isl"

          $size = (Get-Item "installer/ChineseSimplified.isl").Length
          if ($size -lt 1000) {
            Write-Error "ChineseSimplified.isl の取得結果が小さすぎます ($size bytes)。上流の移動を疑ってください。"
            exit 1
          }
          Write-Host "ChineseSimplified.isl ($size bytes)"

      # ─────────────────────────────────────
      # 11b. インストーラーの使用許諾画面用テキストを生成
      #     詳細は build-and-release.yml の同名ステップのコメントを参照。
      # ─────────────────────────────────────
      - name: Generate license files for installer
        shell: pwsh
        run: ./installer/Convert-LicenseFiles.ps1

      # ─────────────────────────────────────
      # 12. ウィザード用バナー画像を app.ico から生成
      # ─────────────────────────────────────
      - name: Generate wizard banner images
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = New-Object System.Drawing.Icon("app.ico", 256, 256)
          $iconBmp = $icon.ToBitmap()

          # 大バナー (164x314) - ダークレッド背景にロゴ
          $lg = New-Object System.Drawing.Bitmap(164, 314)
          $g = [System.Drawing.Graphics]::FromImage($lg)
          $g.SmoothingMode = 'HighQuality'
          $g.InterpolationMode = 'HighQualityBicubic'
          $g.Clear([System.Drawing.Color]::FromArgb(120, 0, 0))
          $g.DrawImage($iconBmp, 32, 90, 100, 100)
          $g.Dispose()
          $lg.Save("installer/WizardImage.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $lg.Dispose()

          # 小バナー (55x55) - ダークレッド背景にロゴ
          $sm = New-Object System.Drawing.Bitmap(55, 55)
          $g = [System.Drawing.Graphics]::FromImage($sm)
          $g.SmoothingMode = 'HighQuality'
          $g.InterpolationMode = 'HighQualityBicubic'
          $g.Clear([System.Drawing.Color]::FromArgb(120, 0, 0))
          $g.DrawImage($iconBmp, 5, 5, 45, 45)
          $g.Dispose()
          $sm.Save("installer/WizardSmallImage.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $sm.Dispose()

          $iconBmp.Dispose()
          $icon.Dispose()
          Write-Host "Wizard images generated"

      # ─────────────────────────────────────
      # 13. Inno Setup でインストーラーをビルド
      # ─────────────────────────────────────
      - name: Build EXE installer
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $fileVer = "${{ steps.get_version.outputs.FILE_VERSION }}"
          $sourceDir = "$env:GITHUB_WORKSPACE\publish\installer-src"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            /DMyAppFileVersion=$fileVer `
            /DMyAppArch=${{ matrix.arch }} `
            /DMySourceDir=$sourceDir `
            /DBETA `
            installer\setup.iss

      # ─────────────────────────────────────
      # 13. ビルドアーティファクトをアップロード
      # ─────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beta-build-${{ matrix.arch }}
          path: |
            ./publish/OpenDumpViewer_${{ steps.get_version.outputs.FILE_VERSION }}_portable_${{ matrix.arch }}.zip
            ./publish/OpenDumpViewer_${{ steps.get_version.outputs.FILE_VERSION }}_installer_${{ matrix.arch }}.exe

      - name: Save version info
        shell: pwsh
        run: |
          "${{ steps.get_version.outputs.VERSION }}" | Set-Content -Path "./publish/version.txt" -NoNewline
          "${{ steps.get_version.outputs.FILE_VERSION }}" | Set-Content -Path "./publish/file_version.txt" -NoNewline

      - name: Upload version info
        uses: actions/upload-artifact@v7
        with:
          name: beta-version-info-${{ matrix.arch }}
          path: |
            ./publish/version.txt
            ./publish/file_version.txt

  # ═══════════════════════════════════════════
  # GitHub Pre-release 作成ジョブ
  # ═══════════════════════════════════════════
  release:
    name: Beta / GitHub Pre-release
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      TAG: ${{ steps.get_version.outputs.TAG }}
      FILE_VERSION: ${{ steps.get_version.outputs.FILE_VERSION }}

    steps:
      # ─────────────────────────────────────
      # 1. ソースコードをチェックアウト
      #    (CHANGELOG.md 読み取り用)
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─────────────────────────────────────
      # 2. 全アーキテクチャのアーティファクトをダウンロード
      # ─────────────────────────────────────
      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: beta-build-x64
          path: ./artifacts

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: beta-build-arm64
          path: ./artifacts

      - name: Download version info
        uses: actions/download-artifact@v8
        with:
          name: beta-version-info-x64
          path: ./meta

      # ─────────────────────────────────────
      # 3. バージョン情報を読み取り
      # ─────────────────────────────────────
      - name: Read version
        id: get_version
        shell: pwsh
        run: |
          $version = Get-Content "./meta/version.txt" -Raw
          $fileVer = Get-Content "./meta/file_version.txt" -Raw
          Write-Host "Version: $version"
          Write-Host "File version: $fileVer"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version-beta" >> $env:GITHUB_OUTPUT
          echo "FILE_VERSION=$fileVer" >> $env:GITHUB_OUTPUT

      # ─────────────────────────────────────
      # 4. CHANGELOG.md からリリースノートを抽出
      # ─────────────────────────────────────
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"

          if (-not (Test-Path "CHANGELOG.md")) {
            Write-Host "CHANGELOG.md が見つかりません。空のリリースノートを使用します。"
            $notes = "No release notes."
          } else {
            $content = Get-Content "CHANGELOG.md" -Raw
            $escaped = [regex]::Escape($version)
            $pattern = "(?ms)^## \[?${escaped}\]?[^\n]*\n(.*?)(?=\n## |\Z)"
            $match = [regex]::Match($content, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
              Write-Host "リリースノートを取得しました"
            } else {
              $notes = "No release notes for v${version}."
              Write-Host "該当バージョンのセクションが見つかりませんでした"
            }
          }

          $delimiter = "EOF_CHANGELOG"
          "NOTES<<$delimiter" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $notes | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $delimiter | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # ─────────────────────────────────────
      # 5. GitHub Release の作成 (Pre-release)
      # ─────────────────────────────────────
      - name: Create GitHub Beta Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.get_version.outputs.TAG }}"
          $fileVer = "${{ steps.get_version.outputs.FILE_VERSION }}"
          $notes = @"
          > **This is a beta release.** Install alongside the stable version for testing.

          ${{ steps.changelog.outputs.NOTES }}
          "@

          $notesFile = New-TemporaryFile
          $notes | Set-Content -Path $notesFile -Encoding utf8

          gh release create $tag `
            --title "Beta $tag" `
            --notes-file $notesFile `
            --prerelease `
            "./artifacts/OpenDumpViewer_${fileVer}_portable_x64.zip" `
            "./artifacts/OpenDumpViewer_${fileVer}_installer_x64.exe" `
            "./artifacts/OpenDumpViewer_${fileVer}_portable_arm64.zip" `
            "./artifacts/OpenDumpViewer_${fileVer}_installer_arm64.exe"

          Remove-Item $notesFile

  # ═══════════════════════════════════════════
  # Winget Beta 公開ジョブ (並列)
  # Beta 用パッケージ ID: OpenDumpViewer.OpenDumpViewer.BETA
  # ═══════════════════════════════════════════
  publish-winget:
    name: Beta / Winget
    needs: release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: beta-build-x64
          path: ./artifacts

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: beta-build-arm64
          path: ./artifacts

      - name: Publish to Winget (Beta)
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.VERSION }}"
          $fileVer = "${{ needs.release.outputs.FILE_VERSION }}"
          $baseUrl = "https://github.com/Open-DUMP-Viewer/Open-DUMP-Viewer/releases/download/${fileVer}"

          $exeX64 = "./artifacts/OpenDumpViewer_${fileVer}_installer_x64.exe"
          $exeArm64 = "./artifacts/OpenDumpViewer_${fileVer}_installer_arm64.exe"
          $hashX64 = (Get-FileHash $exeX64 -Algorithm SHA256).Hash
          $hashArm64 = (Get-FileHash $exeArm64 -Algorithm SHA256).Hash

          $pkgId = "OpenDumpViewer.OpenDumpViewer.BETA"
          $dir = "manifests/o/OpenDumpViewer/OpenDumpViewer.BETA/$version"
          New-Item -ItemType Directory -Path $dir -Force

          # バージョンマニフェスト
          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          DefaultLocale: ja-JP
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/$pkgId.yaml" -NoNewline

          # インストーラーマニフェスト
          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          Platform:
          - Windows.Desktop
          MinimumOSVersion: 10.0.17763.0
          InstallerType: inno
          Scope: machine
          InstallModes:
          - interactive
          - silent
          - silentWithProgress
          Installers:
          - Architecture: x64
            InstallerUrl: ${baseUrl}/OpenDumpViewer_${fileVer}_installer_x64.exe
            InstallerSha256: $hashX64
          - Architecture: arm64
            InstallerUrl: ${baseUrl}/OpenDumpViewer_${fileVer}_installer_arm64.exe
            InstallerSha256: $hashArm64
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/$pkgId.installer.yaml" -NoNewline

          # ロケールマニフェスト
          @"
          PackageIdentifier: $pkgId
          PackageVersion: $version
          PackageLocale: ja-JP
          Publisher: YANAI Taketo
          PublisherUrl: https://www.odv.dev/
          PackageName: Open DUMP Viewer for Oracle database (Beta)
          PackageUrl: https://www.odv.dev/
          License: Proprietary
          ShortDescription: Oracle EXP/EXPDP DUMPファイルビューア (Beta)
          Tags:
          - oracle
          - dump
          - viewer
          - database
          - beta
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/$pkgId.locale.ja-JP.yaml" -NoNewline

          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token "${{ secrets.WINGET_TOKEN }}" $dir

  # ═══════════════════════════════════════════
  # Chocolatey Beta 公開ジョブ (並列)
  # プレリリース版として公開
  # ═══════════════════════════════════════════
  publish-chocolatey:
    name: Beta / Chocolatey
    needs: release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: beta-build-x64
          path: ./artifacts

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: beta-build-arm64
          path: ./artifacts

      - name: Publish to Chocolatey (Beta)
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $version = "${{ needs.release.outputs.VERSION }}"
          $fileVer = "${{ needs.release.outputs.FILE_VERSION }}"
          $chocoVersion = "${version}-beta"
          $baseUrl = "https://github.com/Open-DUMP-Viewer/Open-DUMP-Viewer/releases/download/${fileVer}"

          # インストーラーのチェックサムを取得
          $exeX64   = "./artifacts/OpenDumpViewer_${fileVer}_installer_x64.exe"
          $exeArm64 = "./artifacts/OpenDumpViewer_${fileVer}_installer_arm64.exe"
          $hashX64   = (Get-FileHash $exeX64 -Algorithm SHA256).Hash.ToLower()
          $hashArm64 = (Get-FileHash $exeArm64 -Algorithm SHA256).Hash.ToLower()

          # nuspec のバージョンを更新 (プレリリース)
          $nuspec = Get-Content "chocolatey/open-dump-viewer.nuspec" -Raw
          $nuspec = $nuspec -replace '<version>[^<]+</version>', "<version>${chocoVersion}</version>"
          Set-Content "chocolatey/open-dump-viewer.nuspec" $nuspec -NoNewline

          # chocolateyinstall.ps1 のバージョンとチェックサムを更新
          $install = Get-Content "chocolatey/tools/chocolateyinstall.ps1" -Raw
          $install = $install -replace "\`$version\s*=\s*'[^']+'", "`$version     = '${version}'"
          $install = $install -replace "\`$checksum_x64\s*=\s*'[^']+'", "`$checksum_x64   = '${hashX64}'"
          $install = $install -replace "\`$checksum_arm64\s*=\s*'[^']+'", "`$checksum_arm64 = '${hashArm64}'"
          Set-Content "chocolatey/tools/chocolateyinstall.ps1" $install -NoNewline

          # パッケージをビルド
          choco pack "chocolatey/open-dump-viewer.nuspec" --output-directory "./artifacts"

          # Chocolatey Community Repository にプッシュ
          if ($env:CHOCOLATEY_API_KEY) {
            choco push "./artifacts/open-dump-viewer.${chocoVersion}.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
            Write-Host "Chocolatey beta package v${chocoVersion} published successfully"
          } else {
            Write-Warning "CHOCOLATEY_API_KEY not set — skipping push"
          }
