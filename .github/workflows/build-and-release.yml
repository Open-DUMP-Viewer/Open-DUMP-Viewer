name: Build and Release

# ───────────────────────────────────────────
# トリガー:
#   - release ブランチへの push 時に通常実行 (リリース・公開まで行う)
#   - workflow_dispatch で任意ブランチから手動実行 (テスト用)
#     既定 (publish_release=false) では GitHub Release 作成と
#     Winget/Chocolatey/Store 公開を行わず、ビルド + 署名までを確認する。
#     (旧 skip_store_submit 入力はどこからも参照されていなかったため置き換えた)
# ───────────────────────────────────────────
on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'true で GitHub Release 作成と Winget/Chocolatey/Store 公開まで行う(既定 false = ビルド・署名の動作確認のみ)'
        type: boolean
        default: false

# GITHUB_TOKEN の既定を read-only に絞る。宣言がないと、ジョブはリポジトリ設定の
# 既定権限(write を含みうる)をそのまま受け取る——CodeQL の
# actions/missing-workflow-permissions が指摘していた状態。
#
# 書き込みが要るジョブだけが自分の permissions ブロックで上書きする(ジョブ側の
# 宣言はワークフロー側を継承ではなく **置換** する):
#   - build   : id-token: write (WIF の OIDC トークン発行)
#   - release : contents: write (gh release create)
# 残りのジョブ (bundle-msix / publish-winget / publish-chocolatey / publish-store)
# は checkout と同一 run 内の artifact 授受しか行わず、外部公開はいずれも
# GITHUB_TOKEN ではなく専用のシークレット (WINGET_TOKEN・CHOCOLATEY_API_KEY・
# Azure AD 資格情報) を使うため read-only で足りる。
permissions:
  contents: read

# 同一ブランチのリリース実行が重ならないようにする(連続 push で 2 本のリリースが
# 並走し、Release 作成や Store 提出が競合するのを防ぐ)。
# cancel-in-progress は **false**。本ワークフローは実リリースを作成し Microsoft Store へ
# 提出するため、途中でキャンセルすると中途半端な成果物や提出が残りうる。後続の実行は
# 割り込まずに待たせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════
  # ビルドジョブ (x64 / ARM64 並列)
  # ═══════════════════════════════════════════
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest

    # コード署名の承認ゲート: 署名ステップが WIF の OIDC トークンを必要とし、GCP 側の信頼条件が
    # Environment `release-signing` を要求するため、build ジョブ全体をこの Environment に載せる。
    # required reviewers = オーナーのため、本ワークフローの実行はビルド開始前に承認 1 回を要する
    # (x64/arm64 の 2 ジョブは 1 回の承認でまとめて通る)。
    environment: release-signing
    permissions:
      contents: read
      id-token: write  # WIF の OIDC トークン発行に必要

    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
            msvc_arch: x64
          - arch: arm64
            rid: win-arm64
            msvc_arch: amd64_arm64

    steps:
      # ─────────────────────────────────────
      # 1. ソースコードをチェックアウト
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─────────────────────────────────────
      # 2. .NET SDK のセットアップ (.NET 10)
      # ─────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ─────────────────────────────────────
      # 3. C ネイティブ DLL ビルド
      #    vcvarsall.bat で MSVC 環境を設定後、cl.exe でビルド
      # ─────────────────────────────────────
      - name: Build native DLL (Open_DumpParser.dll)
        shell: cmd
        working-directory: Logics/DumpParser
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }}
          set DEFS=/DWINDOWS /DWIN32 /DUTF8 /DODV_DLL_MODE /D_CRT_SECURE_NO_WARNINGS /DNDEBUG
          set CFLAGS=/O2 /W3 /LD /MT /nologo /utf-8 /std:c11
          set SRCS=odv_api.c odv_detect.c odv_expdp.c odv_exp.c odv_record.c odv_number.c odv_datetime.c odv_charset.c odv_xml.c odv_csv.c odv_sql.c
          cl %CFLAGS% %DEFS% /I "." /Fe"Open_DumpParser.dll" %SRCS% /link /DLL
          if %ERRORLEVEL% NEQ 0 exit /b 1
          del /q *.obj *.exp *.lib 2>nul
          echo DLL built successfully (${{ matrix.arch }})
          dir Open_DumpParser.dll

      # ─────────────────────────────────────
      # 5. バージョン番号を .vbproj から取得
      # ─────────────────────────────────────
      - name: Get version from .vbproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "Open DUMP Viewer.vbproj"
          $version = $xml.Project.PropertyGroup `
            | Where-Object { $_.Version } `
            | Select-Object -ExpandProperty Version -First 1
          if (-not $version) { $version = "1.0.0" }
          Write-Host "Version: $version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT

      # ─────────────────────────────────────
      # 6. NuGet パッケージの復元
      # ─────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore "Open DUMP Viewer.vbproj"

      # ─────────────────────────────────────
      # 7. アプリビルド (Self-contained)
      #    .NET ランタイム同梱
      #    ポータブル版 (ZIP) と インストーラーで共用
      # ─────────────────────────────────────
      - name: Build application (self-contained)
        run: |
          dotnet publish "Open DUMP Viewer.vbproj" `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            --output ./publish/app

      # ─────────────────────────────────────
      # 7b. コード署名 (自前バイナリ)
      #     vars.ODV_SIGNING == 'enabled' のときだけ動く (緊急オフスイッチ)。
      #     秘密鍵は GCP KMS の HSM にあり、WIF の短命トークンで署名する (長期 Secret なし)。
      #     portable / installer / MSIX へ複製する前に publish 出力そのものを署名する。
      #     詳細: installer/sign/README.md (署名基盤は Yagura プロジェクトと共有)
      # ─────────────────────────────────────
      - name: Authenticate to Google Cloud (WIF)
        if: vars.ODV_SIGNING == 'enabled'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNER_SA }}
          token_format: access_token

      - name: Setup Java (jsign 実行用)
        if: vars.ODV_SIGNING == 'enabled'
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # 供給網保護: jsign を版固定 + SHA256 照合してから使う。
      - name: Download and verify jsign 7.5
        if: vars.ODV_SIGNING == 'enabled'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar' -OutFile jsign.jar
          $hash = (Get-FileHash jsign.jar -Algorithm SHA256).Hash.ToLower()
          $expected = '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c'
          if ($hash -ne $expected) { throw "jsign SHA256 不一致: got=$hash expected=$expected" }
          Write-Host 'jsign 7.5 SHA256 OK'

      - name: Sign own binaries (${{ matrix.arch }})
        if: vars.ODV_SIGNING == 'enabled'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $files = @(
            "./publish/app/Open DUMP Viewer.exe",
            "./publish/app/Open DUMP Viewer.dll",
            "./publish/app/Open_DumpParser.dll"
          )
          ./installer/sign/Invoke-OdvSign.ps1 -JsignJar jsign.jar `
            -KeyRingResource '${{ vars.GCP_KEYRING }}' -KeyAlias '${{ vars.GCP_KEY_ALIAS }}' `
            -CertFile installer/sign/codesign-chain.pem `
            -AccessToken '${{ steps.auth.outputs.access_token }}' `
            -ExpectedSubject '${{ vars.SIGNER_SUBJECT }}' -Files $files

      - name: Copy build output for portable and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./publish/portable" -Force | Out-Null
          New-Item -ItemType Directory -Path "./publish/installer-src" -Force | Out-Null
          Copy-Item -Path "./publish/app/*" -Destination "./publish/portable" -Recurse -Force
          Copy-Item -Path "./publish/app/*" -Destination "./publish/installer-src" -Recurse -Force

      # ─────────────────────────────────────
      # 8. DLL が出力に含まれていることを検証
      # ─────────────────────────────────────
      - name: Verify native DLL in output
        shell: pwsh
        run: |
          if (-not (Test-Path "./publish/app/Open_DumpParser.dll")) {
            Write-Error "Open_DumpParser.dll がビルド出力に含まれていません"
            exit 1
          }
          Write-Host "Open_DumpParser.dll found in build output (${{ matrix.arch }})"

      # ─────────────────────────────────────
      # 9. ポータブル版を ZIP に圧縮
      # ─────────────────────────────────────
      - name: Zip portable
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Compress-Archive `
            -Path "./publish/portable/*" `
            -DestinationPath "./publish/OpenDumpViewer_v${version}_portable_${{ matrix.arch }}.zip"

      # ─────────────────────────────────────
      # 10. Inno Setup のインストール
      # ─────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # ─────────────────────────────────────
      # 11. 中国語簡体字の言語ファイルをダウンロード
      #     2026-07-18: 上流で ChineseSimplified.isl が Unofficial/ から公式の
      #     Files/Languages/ へ昇格し、旧 URL が 404 になったためパスを更新した
      #     (v4.2.0-beta のビルド失敗で判明)。上流の移動を早期に検知するため
      #     取得サイズも検証する。
      # ─────────────────────────────────────
      - name: Download Chinese Simplified language file
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" `
            -OutFile "installer/ChineseSimplified.isl"

          $size = (Get-Item "installer/ChineseSimplified.isl").Length
          if ($size -lt 1000) {
            Write-Error "ChineseSimplified.isl の取得結果が小さすぎます ($size bytes)。上流の移動を疑ってください。"
            exit 1
          }
          Write-Host "ChineseSimplified.isl ($size bytes)"

      # ─────────────────────────────────────
      # 11b. インストーラーの使用許諾画面用テキストを生成
      #     原本 (EULA.md / LICENSE) から平文を作る。文面を二重管理しないため
      #     installer/ 配下には commit せずビルド時に生成する。
      #     変換ロジックの詳細と、Markdown/HTML を落とす理由はスクリプト側の
      #     コメントを参照 (正式版・ベータ版で同じスクリプトを共有する)。
      # ─────────────────────────────────────
      - name: Generate license files for installer
        shell: pwsh
        run: ./installer/Convert-LicenseFiles.ps1

      # ─────────────────────────────────────
      # 12. ウィザード用バナー画像を app.ico から生成
      # ─────────────────────────────────────
      - name: Generate wizard banner images
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = New-Object System.Drawing.Icon("app.ico", 256, 256)
          $iconBmp = $icon.ToBitmap()

          # 大バナー (164x314) - ダークレッド背景にロゴ
          $lg = New-Object System.Drawing.Bitmap(164, 314)
          $g = [System.Drawing.Graphics]::FromImage($lg)
          $g.SmoothingMode = 'HighQuality'
          $g.InterpolationMode = 'HighQualityBicubic'
          $g.Clear([System.Drawing.Color]::FromArgb(120, 0, 0))
          $g.DrawImage($iconBmp, 32, 90, 100, 100)
          $g.Dispose()
          $lg.Save("installer/WizardImage.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $lg.Dispose()

          # 小バナー (55x55) - ダークレッド背景にロゴ
          $sm = New-Object System.Drawing.Bitmap(55, 55)
          $g = [System.Drawing.Graphics]::FromImage($sm)
          $g.SmoothingMode = 'HighQuality'
          $g.InterpolationMode = 'HighQualityBicubic'
          $g.Clear([System.Drawing.Color]::FromArgb(120, 0, 0))
          $g.DrawImage($iconBmp, 5, 5, 45, 45)
          $g.Dispose()
          $sm.Save("installer/WizardSmallImage.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $sm.Dispose()

          $iconBmp.Dispose()
          $icon.Dispose()
          Write-Host "Wizard images generated"

      # ─────────────────────────────────────
      # 13. Inno Setup でインストーラーをビルド
      # ─────────────────────────────────────
      - name: Build EXE installer
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $sourceDir = "$env:GITHUB_WORKSPACE\publish\installer-src"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            /DMyAppFileVersion=v$version `
            /DMyAppArch=${{ matrix.arch }} `
            /DMySourceDir=$sourceDir `
            installer\setup.iss

      # ─────────────────────────────────────
      # 13b. インストーラー EXE の署名
      #      (中身の自前バイナリは 7b で署名済み。MSIX は Store が署名するため対象外)
      # ─────────────────────────────────────
      - name: Sign EXE installer (${{ matrix.arch }})
        if: vars.ODV_SIGNING == 'enabled'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.get_version.outputs.VERSION }}"
          ./installer/sign/Invoke-OdvSign.ps1 -JsignJar jsign.jar `
            -KeyRingResource '${{ vars.GCP_KEYRING }}' -KeyAlias '${{ vars.GCP_KEY_ALIAS }}' `
            -CertFile installer/sign/codesign-chain.pem `
            -AccessToken '${{ steps.auth.outputs.access_token }}' `
            -ExpectedSubject '${{ vars.SIGNER_SUBJECT }}' `
            -Files @("./publish/OpenDumpViewer_v${version}_installer_${{ matrix.arch }}.exe")

      # ─────────────────────────────────────
      # 14. MSIX 用 Visual Assets を生成
      #     vars.MSIX_IDENTITY_NAME が未設定の場合はスキップ
      # ─────────────────────────────────────
      - name: Generate MSIX visual assets
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          pwsh -File installer/msix/scripts/generate-assets.ps1 `
            -IconPath "$env:GITHUB_WORKSPACE\app.ico" `
            -OutputDir "$env:GITHUB_WORKSPACE\installer\msix\Images"

      # ─────────────────────────────────────
      # 15. MSIX パッケージをビルド (アーキテクチャ別)
      # ─────────────────────────────────────
      - name: Build MSIX (${{ matrix.arch }})
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          pwsh -File installer/msix/scripts/build-msix.ps1 `
            -PublishDir "$env:GITHUB_WORKSPACE\publish\installer-src" `
            -OutputMsix "$env:GITHUB_WORKSPACE\publish\OpenDumpViewer_v${version}_${{ matrix.arch }}.msix" `
            -Version $version `
            -Architecture ${{ matrix.arch }} `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}" `
            -IdentityPublisher "${{ vars.MSIX_IDENTITY_PUBLISHER }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"

      # ─────────────────────────────────────
      # 16. ビルドアーティファクトをアップロード
      # ─────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: |
            ./publish/OpenDumpViewer_v${{ steps.get_version.outputs.VERSION }}_portable_${{ matrix.arch }}.zip
            ./publish/OpenDumpViewer_v${{ steps.get_version.outputs.VERSION }}_installer_${{ matrix.arch }}.exe
            ./publish/OpenDumpViewer_v${{ steps.get_version.outputs.VERSION }}_${{ matrix.arch }}.msix

      - name: Save version info
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Set-Content -Path "./publish/version.txt" -Value $version -NoNewline

      - name: Upload version info
        uses: actions/upload-artifact@v7
        with:
          name: version-info-${{ matrix.arch }}
          path: ./publish/version.txt

  # ═══════════════════════════════════════════
  # MSIX バンドルジョブ (x64 + arm64 を .msixbundle に統合)
  # vars.MSIX_IDENTITY_NAME 未設定時はスキップ
  # ═══════════════════════════════════════════
  bundle-msix:
    name: Bundle MSIX
    needs: build
    runs-on: windows-latest
    if: vars.MSIX_IDENTITY_NAME != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: ./artifacts/x64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: ./artifacts/arm64

      - name: Read version
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "Open DUMP Viewer.vbproj"
          $version = ($xml.Project.PropertyGroup | Where-Object { $_.Version }).Version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Bundle MSIX
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $bundleInput = "$env:GITHUB_WORKSPACE\bundle-input"
          New-Item -ItemType Directory -Path $bundleInput -Force | Out-Null
          Copy-Item "./artifacts/x64/*.msix" $bundleInput
          Copy-Item "./artifacts/arm64/*.msix" $bundleInput
          New-Item -ItemType Directory -Path "./publish" -Force | Out-Null
          pwsh -File installer/msix/scripts/bundle-msix.ps1 `
            -InputDir $bundleInput `
            -OutputBundle "./publish/OpenDumpViewer_v${version}.msixbundle" `
            -Version $version

      - name: Upload .msixbundle
        uses: actions/upload-artifact@v7
        with:
          name: msixbundle
          path: ./publish/OpenDumpViewer_v${{ steps.get_version.outputs.VERSION }}.msixbundle

  # ═══════════════════════════════════════════
  # リリースジョブ (ビルド完了後に統合)
  # ═══════════════════════════════════════════
  release:
    name: Release / GitHub Release
    needs: [build, bundle-msix]
    # bundle-msix は vars.MSIX_IDENTITY_NAME 未設定時に skip される。
    # その場合でも release は実行する必要があるため if: always() を使用し、
    # build が成功していることだけを必須条件にする。
    # workflow_dispatch では publish_release=true の場合のみ実リリースを作成する
    # (既定 false = ビルド・署名の動作確認のみ。後続の publish-* も release の
    # 成功を条件にしているため連動して skip される)。
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'))
    runs-on: windows-latest

    permissions:
      contents: write  # GitHub Release の作成に必要

    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      TAG: ${{ steps.get_version.outputs.TAG }}

    steps:
      # ─────────────────────────────────────
      # 1. ソースコードをチェックアウト
      #    (CHANGELOG.md 読み取り用)
      # ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ─────────────────────────────────────
      # 2. 全アーキテクチャのアーティファクトをダウンロード
      # ─────────────────────────────────────
      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: ./artifacts

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: ./artifacts

      - name: Download .msixbundle (if MSIX configured)
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/download-artifact@v8
        with:
          name: msixbundle
          path: ./artifacts

      - name: Download version info
        uses: actions/download-artifact@v8
        with:
          name: version-info-x64
          path: ./meta

      # ─────────────────────────────────────
      # 3. バージョン情報を読み取り
      # ─────────────────────────────────────
      - name: Read version
        id: get_version
        shell: pwsh
        run: |
          $version = Get-Content "./meta/version.txt" -Raw
          Write-Host "Version: $version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT

      # ─────────────────────────────────────
      # 4. CHANGELOG.md からリリースノートを抽出
      # ─────────────────────────────────────
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"

          if (-not (Test-Path "CHANGELOG.md")) {
            Write-Host "CHANGELOG.md が見つかりません。空のリリースノートを使用します。"
            $notes = "No release notes."
          } else {
            $content = Get-Content "CHANGELOG.md" -Raw
            # ## [0.1.2] または ## 0.1.2 の形式に対応
            $escaped = [regex]::Escape($version)
            $pattern = "(?ms)^## \[?${escaped}\]?[^\n]*\n(.*?)(?=\n## |\Z)"
            $match = [regex]::Match($content, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
              Write-Host "リリースノートを取得しました"
            } else {
              $notes = "No release notes for v${version}."
              Write-Host "該当バージョンのセクションが見つかりませんでした"
            }
          }

          # 複数行を GITHUB_OUTPUT に書き込む
          $delimiter = "EOF_CHANGELOG"
          "NOTES<<$delimiter" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $notes | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $delimiter | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # ─────────────────────────────────────
      # 5. GitHub Release の作成 & アップロード
      # ─────────────────────────────────────
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.get_version.outputs.TAG }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $notes = @"
          ${{ steps.changelog.outputs.NOTES }}
          "@

          # タグが既に存在する場合はリリースを更新、なければ新規作成
          $notesFile = New-TemporaryFile
          $notes | Set-Content -Path $notesFile -Encoding utf8

          $assets = @(
            "./artifacts/OpenDumpViewer_v${version}_portable_x64.zip",
            "./artifacts/OpenDumpViewer_v${version}_installer_x64.exe",
            "./artifacts/OpenDumpViewer_v${version}_portable_arm64.zip",
            "./artifacts/OpenDumpViewer_v${version}_installer_arm64.exe"
          )
          $bundle = "./artifacts/OpenDumpViewer_v${version}.msixbundle"
          if (Test-Path $bundle) { $assets += $bundle }

          gh release create $tag `
            --title "Release $tag" `
            --notes-file $notesFile `
            @assets

          Remove-Item $notesFile

  # ═══════════════════════════════════════════
  # Winget 公開ジョブ (並列)
  # needs を publish-* 全ジョブで揃えて UI 上の grouping を統一
  # bundle-msix は Winget では使わないが、視覚整合のため待つ
  # ═══════════════════════════════════════════
  publish-winget:
    name: Release / Winget
    needs: [release, bundle-msix]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: ./artifacts

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: ./artifacts

      # wingetcreate は submit の直前に winget-pkgs のフォークを upstream と同期するが、
      # フォークが取り残されている・分岐していると自動同期が失敗し、
      # "The forked repository could not be synced with the upstream commits" で
      # submit ごと落ちる (2026-08-10 の beta ラン #63 で発生。マニフェスト自体は検証を通っていた)。
      # winget-pkgs は 1 日あたりの commit 数が多く、リリース間隔が空くほど確実に取り残される
      # ため、submit の前にこちらから明示的に同期しておく。
      #
      # --force は分岐していた場合にフォークの既定ブランチを upstream へハードリセットする。
      # このフォークは submit 用のミラーで、wingetcreate は PR ごとに別ブランチを切るため、
      # 既定ブランチに残しておくべき変更はない。
      #
      # 所有者名を固定で書かないのは、WINGET_TOKEN のアカウントが変わっても壊れないようにするため。
      - name: Sync winget-pkgs fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # 同期の失敗でリリースを止めない (wingetcreate 側の自動同期に委ねる)。
          # PowerShell 7.4 以降は native コマンドの非ゼロ終了が既定で終端エラーになるため、
          # $LASTEXITCODE で判定できるよう明示的に無効化する。
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $owner = gh api user --jq '.login'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($owner)) {
            Write-Host "::warning::WINGET_TOKEN の所有者を特定できなかったため同期をスキップする"
            exit 0
          }

          # 初回は wingetcreate がフォークを作るので、無い場合は同期不要
          gh repo view "$owner/winget-pkgs" --json name 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::notice::$owner/winget-pkgs が無いため同期をスキップする (wingetcreate が作成する)"
            exit 0
          }

          Write-Host "Syncing $owner/winget-pkgs with microsoft/winget-pkgs"
          gh repo sync "$owner/winget-pkgs" --force
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::フォークの同期に失敗した。wingetcreate 側の自動同期に委ねる"
          }
          exit 0

      - name: Publish to Winget
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.VERSION }}"
          $baseUrl = "https://github.com/Open-DUMP-Viewer/Open-DUMP-Viewer/releases/download/v${version}"

          # 各アーキテクチャの EXE ハッシュを取得
          $exeX64 = "./artifacts/OpenDumpViewer_v${version}_installer_x64.exe"
          $exeArm64 = "./artifacts/OpenDumpViewer_v${version}_installer_arm64.exe"
          $hashX64 = (Get-FileHash $exeX64 -Algorithm SHA256).Hash
          $hashArm64 = (Get-FileHash $exeArm64 -Algorithm SHA256).Hash

          # マニフェストディレクトリ作成
          $dir = "manifests/o/OpenDumpViewer/OpenDumpViewer/$version"
          New-Item -ItemType Directory -Path $dir -Force

          # バージョンマニフェスト
          @"
          PackageIdentifier: OpenDumpViewer.OpenDumpViewer
          PackageVersion: $version
          DefaultLocale: ja-JP
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/OpenDumpViewer.OpenDumpViewer.yaml" -NoNewline

          # インストーラーマニフェスト (x64 + ARM64)
          @"
          PackageIdentifier: OpenDumpViewer.OpenDumpViewer
          PackageVersion: $version
          Platform:
          - Windows.Desktop
          MinimumOSVersion: 10.0.17763.0
          InstallerType: inno
          Scope: machine
          InstallModes:
          - interactive
          - silent
          - silentWithProgress
          Installers:
          - Architecture: x64
            InstallerUrl: ${baseUrl}/OpenDumpViewer_v${version}_installer_x64.exe
            InstallerSha256: $hashX64
          - Architecture: arm64
            InstallerUrl: ${baseUrl}/OpenDumpViewer_v${version}_installer_arm64.exe
            InstallerSha256: $hashArm64
          ManifestType: installer
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/OpenDumpViewer.OpenDumpViewer.installer.yaml" -NoNewline

          # ロケールマニフェスト
          @"
          PackageIdentifier: OpenDumpViewer.OpenDumpViewer
          PackageVersion: $version
          PackageLocale: ja-JP
          Publisher: YANAI Taketo
          PublisherUrl: https://www.odv.dev/
          PackageName: Open DUMP Viewer for Oracle database
          PackageUrl: https://www.odv.dev/
          License: Proprietary
          ShortDescription: Oracle EXP/EXPDP DUMPファイルビューア
          Tags:
          - oracle
          - dump
          - viewer
          - database
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ -replace '(?m)^          ', '' | Set-Content "$dir/OpenDumpViewer.OpenDumpViewer.locale.ja-JP.yaml" -NoNewline

          # wingetcreate で winget-pkgs へ PR 送信
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token "${{ secrets.WINGET_TOKEN }}" $dir

  # ═══════════════════════════════════════════
  # Chocolatey 公開ジョブ (並列)
  # needs を publish-* 全ジョブで揃えて UI 上の grouping を統一
  # ═══════════════════════════════════════════
  publish-chocolatey:
    name: Release / Chocolatey
    needs: [release, bundle-msix]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-x64
          path: ./artifacts

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: ./artifacts

      - name: Publish to Chocolatey
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $version = "${{ needs.release.outputs.VERSION }}"
          $baseUrl = "https://github.com/Open-DUMP-Viewer/Open-DUMP-Viewer/releases/download/v${version}"

          # インストーラーのチェックサムを取得
          $exeX64   = "./artifacts/OpenDumpViewer_v${version}_installer_x64.exe"
          $exeArm64 = "./artifacts/OpenDumpViewer_v${version}_installer_arm64.exe"
          $hashX64   = (Get-FileHash $exeX64 -Algorithm SHA256).Hash.ToLower()
          $hashArm64 = (Get-FileHash $exeArm64 -Algorithm SHA256).Hash.ToLower()

          # nuspec のバージョンを更新
          $nuspec = Get-Content "chocolatey/open-dump-viewer.nuspec" -Raw
          $nuspec = $nuspec -replace '<version>[^<]+</version>', "<version>${version}</version>"
          Set-Content "chocolatey/open-dump-viewer.nuspec" $nuspec -NoNewline

          # chocolateyinstall.ps1 のバージョンとチェックサムを更新
          $install = Get-Content "chocolatey/tools/chocolateyinstall.ps1" -Raw
          $install = $install -replace "\`$version\s*=\s*'[^']+'", "`$version     = '${version}'"
          $install = $install -replace "\`$checksum_x64\s*=\s*'[^']+'", "`$checksum_x64   = '${hashX64}'"
          $install = $install -replace "\`$checksum_arm64\s*=\s*'[^']+'", "`$checksum_arm64 = '${hashArm64}'"
          Set-Content "chocolatey/tools/chocolateyinstall.ps1" $install -NoNewline

          # VERIFICATION.txt のチェックサムを更新
          $verify = Get-Content "chocolatey/tools/VERIFICATION.txt" -Raw
          $verify = $verify -replace '(?<=x64:\s+)[a-f0-9]{64}', $hashX64
          $verify = $verify -replace '(?<=ARM64:\s+)[a-f0-9]{64}', $hashArm64
          Set-Content "chocolatey/tools/VERIFICATION.txt" $verify -NoNewline

          # パッケージをビルド
          choco pack "chocolatey/open-dump-viewer.nuspec" --output-directory "./artifacts"

          # Chocolatey Community Repository にプッシュ
          if ($env:CHOCOLATEY_API_KEY) {
            choco push "./artifacts/open-dump-viewer.${version}.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
            Write-Host "Chocolatey package v${version} published successfully"
          } else {
            Write-Warning "CHOCOLATEY_API_KEY not set — skipping push"
          }

  # ═══════════════════════════════════════════
  # Microsoft Store 公開ジョブ (並列)
  # vars.STORE_PRODUCT_ID 未設定時はスキップ
  #
  # 提出は 3 段構えで行う (単発の `msstore publish` ではない):
  #   1. --noCommit でパッケージだけ上げ、提出を下書きのまま止める
  #   2. 下書きの「このバージョンの新機能」を CHANGELOG.md の本文で差し替える
  #   3. コミットして認定へ回す
  # `msstore publish` は既定でコミットまで進み、コミット済みの提出はメタデータを
  # 差し替えられない。「新機能」欄を CHANGELOG に追随させるには下書きで止める必要がある。
  # 2 か 3 で落ちた場合、Partner Center に下書き提出が残る。次のリリースの
  # `msstore publish` がこれを引き継ぐが、内容が想定どおりか Partner Center で確認すること。
  #
  # ★ 初回提出は msstore CLI では実施できません ★
  #   初回のみ Partner Center で手動で:
  #     - Store listing (説明・スクリーンショット・年齢レーティング等)
  #     - 価格・市場の設定
  #     - 最初の .msixbundle のアップロード
  #   を行い、Microsoft の認定を通す必要があります。
  #   2 回目以降のリリースから本ジョブが自動でパッケージを更新提出します。
  #
  # 初回提出未完了の状態では本ジョブは失敗しますが、continue-on-error により
  # 他の配布チャネル (GitHub Release / Winget / Chocolatey) には影響しません。
  # ═══════════════════════════════════════════
  publish-store:
    name: Release / Microsoft Store
    needs: [release, bundle-msix]
    runs-on: windows-latest
    if: ${{ vars.STORE_PRODUCT_ID != '' && needs.bundle-msix.result == 'success' }}
    # 初回提出未完了の場合の失敗で workflow 全体を失敗にしない
    continue-on-error: true

    steps:
      # CHANGELOG.md と Convert-ReleaseNotes.ps1 を読むため checkout する
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download .msixbundle
        uses: actions/download-artifact@v8
        with:
          name: msixbundle
          path: ./submit

      # ─────────────────────────────────────
      # 「このバージョンの新機能」欄の本文を CHANGELOG.md から生成する。
      # Store を触る前に実行する: CHANGELOG に当該バージョンの節が無い等で失敗しても、
      # Partner Center に中途半端な下書き提出を残さないため。
      # 平文化と 1500 文字の打ち切りはスクリプト側 (変換規則もそちらのコメント参照)。
      # ─────────────────────────────────────
      - name: Generate "What's new" text from CHANGELOG.md
        shell: pwsh
        run: |
          pwsh -File installer/msix/scripts/Convert-ReleaseNotes.ps1 `
            -Version "${{ needs.release.outputs.VERSION }}" `
            -OutputPath "${{ runner.temp }}/store-whats-new.txt"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1
        # Note: action was renamed to microsoft/microsoft-store-apppublisher@v1.1 in 2025-09;
        # both names redirect to the same package. Pin v1 here for stability.

      - name: Configure msstore CLI
        shell: pwsh
        env:
          T: ${{ secrets.AZURE_AD_TENANT_ID }}
          C: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          S: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.STORE_SELLER_ID }}
        run: |
          $tenant = $env:T.Trim()
          $client = $env:C.Trim()
          $secret = $env:S.Trim()
          $seller = $env:SELLER.Trim()
          msstore reconfigure --tenantId $tenant --sellerId $seller --clientId $client --clientSecret $secret

      # ─────────────────────────────────────
      # 1. パッケージのアップロード (コミットはしない)
      # ─────────────────────────────────────
      - name: Upload package to Microsoft Store (draft)
        shell: pwsh
        run: |
          $bundle = Get-ChildItem ./submit/*.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle found to submit" }
          Write-Host "Submitting: $($bundle.Name)"

          # msstore publish の出力を捕捉して、初回提出エラー時は分かりやすいガイドを表示
          # --noCommit: 提出を下書きのまま残す。次のステップで「新機能」欄を差し替える
          $output = msstore publish $bundle.FullName -id ${{ vars.STORE_PRODUCT_ID }} --noCommit 2>&1 | Out-String
          Write-Host $output

          if ($LASTEXITCODE -ne 0) {
            if ($output -match "first submission") {
              Write-Host ""
              Write-Host "════════════════════════════════════════════════════════════════════"
              Write-Host "  ⚠ Microsoft Store: First submission requires manual setup"
              Write-Host ""
              Write-Host "  msstore CLI does not support FIRST submissions for an app."
              Write-Host "  Please complete the initial submission manually in Partner Center:"
              Write-Host "    https://partner.microsoft.com/dashboard/products/${{ vars.STORE_PRODUCT_ID }}"
              Write-Host ""
              Write-Host "  Required: Store listing, age rating, pricing/markets,"
              Write-Host "            and the first .msixbundle upload."
              Write-Host ""
              Write-Host "  After first submission is approved, subsequent automated"
              Write-Host "  releases will work via this CI job."
              Write-Host "════════════════════════════════════════════════════════════════════"
            }
            exit $LASTEXITCODE
          }

      # ─────────────────────────────────────
      # 2. 「このバージョンの新機能」欄を CHANGELOG の本文で差し替える
      #
      # この欄の実体は提出 JSON の listings.<言語>.baseListing.releaseNotes。
      # MSIX パッケージ側 (Package.appxmanifest) には対応する要素が無く、
      # 提出メタデータを更新する以外に設定する方法はない。
      # ─────────────────────────────────────
      - name: Set "What's new in this version" from CHANGELOG.md
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # native コマンドの非ゼロ終了は $LASTEXITCODE で自前に判定する
          # (どのコマンドで落ちたかをメッセージに出すため)
          $PSNativeCommandUseErrorActionPreference = $false
          # 提出 JSON を丸ごと引数として渡すので、引用符のエスケープ規則を固定する
          # (Windows の既定は一部の実行ファイルに Legacy 規則を使い、埋め込みの " が壊れうる)
          $PSNativeCommandArgumentPassing = 'Standard'

          $productId = '${{ vars.STORE_PRODUCT_ID }}'
          $notes = Get-Content "${{ runner.temp }}/store-whats-new.txt" -Raw -Encoding UTF8

          # 出力には進捗表示が混じるため、最初の '{' 以降を JSON として切り出す
          $raw = (msstore submission get $productId | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get が失敗しました (exit $LASTEXITCODE)" }
          $start = $raw.IndexOf('{')
          if ($start -lt 0) { throw "msstore submission get の出力に JSON がありません:`n$raw" }

          # ConvertFrom-Json / ConvertTo-Json ではなく JsonNode を使う。
          # ConvertFrom-Json は日付に見える文字列を [datetime] に変換してしまい、
          # 書き戻すと書式が変わる (mandatoryUpdateEffectiveDate の
          # "1601-01-01T00:00:00.0000000Z" が "1601-01-01T00:00:00Z" になる)。
          # updateMetadata は提出全体の置換なので、触っていない値は原文のまま返す必要がある。
          $submission = [System.Text.Json.Nodes.JsonNode]::Parse($raw.Substring($start))

          $listings = $submission['listings']
          if ($null -eq $listings) {
            throw "提出に listing がありません。Partner Center で Store listing を作成してください。"
          }

          # releaseNotes は listing (言語) ごとに持つ。この製品は 10 言語すべてに翻訳済みの
          # listing があり (説明文も含む)、この欄も v4.1.1 までは言語ごとに訳していた。
          # CHANGELOG.md は日本語のみのため、全 listing に同じ日本語を入れる方針を採る。
          # 意図的な選択で、日本語以外の利用者には訳された説明文の下に日本語の更新履歴が並ぶ。
          # 手作業での 10 言語更新が続かず、v4.2.0 以降 4 リリース分この欄が
          # v4.1.1 のまま止まっていたため、内容が最新であることを優先した。
          # 言語別の文面に戻すなら、このループを言語で分岐させる。
          $langs = @($listings.AsObject() | ForEach-Object { $_.Key })
          foreach ($lang in $langs) {
            $baseListing = $listings[$lang]['baseListing']
            if ($null -eq $baseListing) { throw "listing '$lang' に baseListing がありません" }
            $baseListing['releaseNotes'] = [System.Text.Json.Nodes.JsonNode]::Parse(($notes | ConvertTo-Json))
          }
          Write-Host "Set releaseNotes ($($notes.Length) chars) for: $($langs -join ', ')"

          # 既定のエンコーダーは非 ASCII を \uXXXX に展開し、日本語で JSON が 3 倍近くに
          # 膨らむ。引数長に効くので、そのまま出す方の設定を使う (HTTP 送信のため
          # HTML 用のエスケープは不要。" と \ と制御文字は従来どおりエスケープされる)。
          $jsonOptions = [System.Text.Json.JsonSerializerOptions]::new()
          $jsonOptions.Encoder = [System.Text.Encodings.Web.JavaScriptEncoder]::UnsafeRelaxedJsonEscaping
          $json = $submission.ToJsonString($jsonOptions)

          # JSON はコマンドライン引数として渡る。Windows の上限は 32767 文字
          if ($json.Length -gt 30000) {
            throw "提出 JSON が大きすぎてコマンドライン引数で渡せません ($($json.Length) 文字)"
          }

          msstore submission updateMetadata $productId $json
          if ($LASTEXITCODE -ne 0) { throw "msstore submission updateMetadata が失敗しました (exit $LASTEXITCODE)" }

      # ─────────────────────────────────────
      # 3. 提出のコミット (ここから Microsoft の認定審査に入る)
      # ─────────────────────────────────────
      - name: Commit submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          msstore submission publish '${{ vars.STORE_PRODUCT_ID }}'
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish が失敗しました (exit $LASTEXITCODE)" }
          Write-Host "Submission committed. 認定審査の完了後に Store へ反映されます。"
